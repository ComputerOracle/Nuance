[pytest]
# Without this, `pytest -q` (the bare console-script invocation .github/
# workflows/ci.yml's backend-tests job actually runs) fails to collect a
# single test: `from app.X import Y` needs backend/ on sys.path, and
# pytest's own rootdir-insertion only adds each test file's own directory
# (tests/, which has no __init__.py) — never the invocation directory
# itself. `python -m pytest` gets this for free (the `-m` flag adds cwd),
# which is why running it that way locally always "just worked" and hid
# this. `pythonpath` is pytest's own ini option for exactly this (since
# 7.0) — the correct fix, not a PYTHONPATH env var every invocation has
# to remember to set. Confirmed live: `pytest -q` from backend/ with only
# this file added collects and passes all tests, matching CI's exact
# invocation, with no other change.
pythonpath = .
