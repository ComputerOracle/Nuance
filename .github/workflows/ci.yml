name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: pytest -q
        working-directory: backend

  # ROADMAP.md Part 3 5.1's migration gate: proves a fresh Postgres
  # actually reaches head from nothing but the checked-in migrations
  # (not just that they render as SQL offline), and that `alembic check`
  # sees zero drift between the models and the migration history — the
  # part that actually enforces "a new model change always ships with a
  # matching revision file", not just documents the intent.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nuance
          POSTGRES_PASSWORD: nuance
          POSTGRES_DB: nuance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nuance -d nuance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://nuance:nuance@localhost:5432/nuance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: alembic upgrade head --sql (dry-run, no DB needed)
        run: alembic upgrade head --sql > /dev/null
        working-directory: backend
      - name: alembic upgrade head (against real Postgres)
        run: alembic upgrade head
        working-directory: backend
      - name: alembic check (fails if models and migrations have drifted)
        run: alembic check
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      # Re-gated 2026-09-08 — the react-hooks/set-state-in-effect finding
      # this was waiting on is fixed: nuance-app.tsx's loadData() calls
      # (and the wallet-disconnect setPositions({}) reset next to them)
      # now go through queueMicrotask, deferring past the effect's own
      # synchronous execution rather than setState-ing directly inside
      # it — a true microtask, not a setTimeout(…, 0) macrotask, so
      # there's no perceptible delay before loading actually starts.
      - run: npm run lint
      - run: npm run build

  # ROADMAP.md Part 3 5.3's E2E row: "Full escrow lifecycle: connect a
  # mocked injected wallet -> create escrow -> submit deliverable -> watch
  # consensus resolve -> release funds" (playwright.config.ts, e2e/). Runs
  # the real frontend (next build/start) against the real backend (a
  # throwaway SQLite db, no LLM keys -> services/consensus.py's
  # deterministic offline heuristic) — not mocked API responses, only the
  # wallet and the (unconfigured, deliberately) LLM providers are stood in
  # for. `channel: "chrome"` (playwright.config.ts) uses the runner's
  # already-installed Google Chrome directly — ubuntu-latest ships it —
  # so no `playwright install` browser download is needed here at all.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      # A real backend/venv, matching local dev exactly (see backend/
      # requirements.txt / README) — playwright.config.ts's backend
      # webServer command runs `venv/bin/uvicorn` unconditionally, the
      # same either way, rather than branching CI onto a different
      # invocation than what a contributor runs locally.
      - run: python -m venv venv && venv/bin/pip install -r requirements.txt
        working-directory: backend
      - run: npx playwright test
