name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: pytest -q
        working-directory: backend

  # ROADMAP.md Part 3 5.1's migration gate: proves a fresh Postgres
  # actually reaches head from nothing but the checked-in migrations
  # (not just that they render as SQL offline), and that `alembic check`
  # sees zero drift between the models and the migration history — the
  # part that actually enforces "a new model change always ships with a
  # matching revision file", not just documents the intent.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nuance
          POSTGRES_PASSWORD: nuance
          POSTGRES_DB: nuance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nuance -d nuance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://nuance:nuance@localhost:5432/nuance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: alembic upgrade head --sql (dry-run, no DB needed)
        run: alembic upgrade head --sql > /dev/null
        working-directory: backend
      - name: alembic upgrade head (against real Postgres)
        run: alembic upgrade head
        working-directory: backend
      - name: alembic check (fails if models and migrations have drifted)
        run: alembic check
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      # `npm run lint` deliberately not gated here yet: as of 2026-09-07 it
      # fails on a pre-existing `react-hooks/set-state-in-effect` finding
      # against nuance-app.tsx's core "fetch everything on mount" loadData()
      # pattern — a real architectural question (is that rule's strictness
      # actually wanted against this app's data-loading design?) for
      # whoever owns that file to decide, not something to blind-refactor
      # inside an unrelated CI/infra change. Add this back once that's
      # resolved one way or the other.
      - run: npm run build
